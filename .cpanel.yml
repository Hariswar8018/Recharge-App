---
deployment:
  tasks:
    - export REPOPATH=/home/wpzumbof/Recharge-App
    - export WEBPATH=/home/wpzumbof/public_html
    - export BACKENDPATH=/home/wpzumbof/backend

    # Deploy pre-built Vue frontend
    - /bin/mkdir -p $WEBPATH
    - /bin/cp -R $REPOPATH/web_app/dist/. $WEBPATH/

    # Deploy Node.js backend
    - /bin/mkdir -p $BACKENDPATH
    - /bin/cp -R $REPOPATH/backend/. $BACKENDPATH/
    - /bin/rm -rf $BACKENDPATH/node_modules
    - cd $BACKENDPATH && /home/wpzumbof/nodevenv/backend/22/bin/npm install
    - /bin/mkdir -p $BACKENDPATH/tmp
    - /bin/touch $BACKENDPATH/tmp/restart.txt